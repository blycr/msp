services:
  msp:
    build: .
    image: msp-server:latest
    container_name: msp
    restart: unless-stopped
    init: true
    ports:
      - "8099:8099"
    volumes:
      # /app IS the data volume: config.json, msp.db (+wal/shm), msp.key,
      # thumbs/ and the media cache all persist under ./data on the host.
      # The binary itself lives in /opt and is copied in by the entrypoint.
      - ./data:/app
      # Map your media folders
      - ./media:/media
    environment:
      - MSP_NO_AUTO_OPEN=1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8099/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Copy the binary into the mounted /app, seed a config with a /media share
    # on first boot, then exec the server (exe_dir = /app = volume, so the
    # app's tmp+rename writes land in ./data and survive restarts).
    entrypoint: ["/bin/sh", "-c", "cp /opt/msp-server /app/msp-server && if [ ! -f /app/config.json ]; then printf '%s' '{\"port\":8099,\"shares\":[{\"path\":\"/media\",\"label\":\"media\"}]}' > /app/config.json; fi && exec /app/msp-server"]
