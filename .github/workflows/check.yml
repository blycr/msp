name: check

on:
  push:
    branches: ["**"]
  pull_request:
  # Required: .github/workflows/release.yml consumes this workflow via
  # `uses: ./.github/workflows/check.yml`. Dropping this trigger makes the
  # release workflow fail at startup with "workflow_call event trigger is not
  # found in on:" and zero jobs.
  workflow_call:
    inputs:
      # 调用方（release.yml）自己有一个同样的 8 目标构建矩阵，这里再跑一遍纯属重复。
      # 注意：不能用 github.event_name != 'workflow_call' 判断 —— 在 reusable
      # workflow 里 github 上下文属于**调用方**，event_name 是 "push"。
      skip_build_check:
        description: "跳过 build-check 矩阵（调用方会自行构建全部目标）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Build Frontend
        run: |
          cd web
          bun install --frozen-lockfile
          bun run build

      - name: Upload Frontend Bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Frontend Bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Run Go Tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          fail_ci_if_error: false
          verbose: true

      - name: Run Go Vet
        run: go vet ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Create Dummy Frontend
        run: |
          mkdir -p web/dist
          echo "DUMMY" > web/dist/index.html
          echo "DUMMY" > web/dist/manifest.webmanifest

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # Must stay >= the Go version in go.mod: a golangci-lint built with an
          # older Go refuses to lint a module targeting a newer one and exits 3
          # with "can't load config: the Go language version (goX) used to build
          # golangci-lint is lower than the targeted Go version (goY)".
          version: v2.15.0
          args: --timeout=5m

  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Create Dummy Frontend
        run: |
          mkdir -p web/dist
          echo "DUMMY" > web/dist/index.html
          echo "DUMMY" > web/dist/manifest.webmanifest

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # Advisory. continue-on-error is set on the STEP, not the job: a job-level
      # flag still reports the job as failed and paints a red X on every PR,
      # which is pure noise for results nobody can act on from a PR (the runner
      # toolchain's own stdlib CVEs). Findings stay visible in the job log and in
      # the run summary written by the next step.
      - name: Run govulncheck
        id: govulncheck
        continue-on-error: true
        run: |
          set -o pipefail
          govulncheck ./... 2>&1 | tee govulncheck.txt

      - name: Summarize govulncheck findings
        if: always()
        run: |
          if [ ! -f govulncheck.txt ]; then
            echo "govulncheck produced no output" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## govulncheck (advisory)"
            echo ""
            echo '```'
            tail -c 5000 govulncheck.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build-check:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: frontend
    # release.yml 通过 workflow_call 复用它，而 release.yml 自己还有一个同样的
    # 8 目标构建矩阵。发布时再跑这 8 个构建纯属重复，所以由调用方用
    # skip_build_check 显式关掉（push / PR 时不传，默认 false，照常跑）。
    if: ${{ !inputs.skip_build_check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: linux
            goarch: loong64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: "386"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The frontend bundle is identical for every target, so it is built once
      # in the `frontend` job instead of eight times in this matrix.
      - name: Download Frontend Bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Build Binary (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm || '' }}
          CGO_ENABLED: 0
        run: |
          output="msp-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            output="${output}.exe"
          fi
          go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o "${output}" ./cmd/msp
          ls -la "${output}"
