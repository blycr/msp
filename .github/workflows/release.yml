name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g., v1.0.0)'
        required: true
        type: string
      notes:
        description: 'Release Notes / Changelog'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-release:
    name: Build & Release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ""
      RELEASE_NOTES_PATH: ""
      RELEASE_TARGET: ""
      UPLOAD_FILES: ""
      NO_ARTIFACTS: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Build web frontend
        shell: bash
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm run build
          cd ..

      - name: Set release tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="${{ inputs.version }}"
          fi
          if [ "${tag#v}" = "$tag" ]; then
            tag="v$tag"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_TARGET=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "Release tag: $tag"

      - name: Run tests
        run: go test -v ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.7.2
          args: --timeout=5m

      - name: Build all targets via scripts/build.sh
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bin checksums debug || true
          chmod +x scripts/build.sh
          sed -i 's/\r$//' scripts/build.sh
          bash scripts/build.sh -P release -t -l

      - name: Prepare release notes
        shell: bash
        env:
          NOTES_INPUT: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          notes_path="docs/release/$RELEASE_TAG.md"
          if [ -f "$notes_path" ]; then
            tmp_notes="$RUNNER_TEMP/release_notes_$RELEASE_TAG.md"
            cp "$notes_path" "$tmp_notes"
            echo "RELEASE_NOTES_PATH=$tmp_notes" >> "$GITHUB_ENV"
            echo "Using release notes from: $notes_path"
          else
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "Release notes file not found: $notes_path" >&2
              echo "Creating default release notes..."
              tmp_notes="$RUNNER_TEMP/release_notes_$RELEASE_TAG.md"
              echo "Release $RELEASE_TAG" > "$tmp_notes"
              echo "" >> "$tmp_notes"
              echo "See commit history for details." >> "$tmp_notes"
              echo "RELEASE_NOTES_PATH=$tmp_notes" >> "$GITHUB_ENV"
            elif [ -z "$NOTES_INPUT" ]; then
              echo "Release notes file not found and no input notes provided: $notes_path" >&2
              exit 1
            else
              echo "RELEASE_NOTES_PATH=" >> "$GITHUB_ENV"
            fi
          fi

      - name: Remove debug copies
        shell: bash
        run: |
          rm -rf debug || true

      - name: Compute upload file list
        shell: bash
        run: |
          set -euo pipefail
          files=""
          if [ -d bin ]; then
            files="$(find bin -type f -print || true)"
          fi
          if [ -d checksums ]; then
            more="$(find checksums -type f -name '*.sha256' -print || true)"
            files="$(printf "%s\n%s" "$files" "$more")"
          fi
          # Match files in bin/(windows|linux|darwin|arm)/ or checksums/*.sha256
          files="$(printf "%s\n" "$files" | sed '/^$/d' \
            | grep -E '^(bin/(windows|linux|darwin|arm)/.+|checksums/.+\.sha256)$' || true)"
          if [ -z "$files" ]; then
            echo "NO_ARTIFACTS=1" >> "$GITHUB_ENV"
            echo "UPLOAD_FILES=" >> "$GITHUB_ENV"
            echo "[Warn] No artifacts found to upload"
          else
            {
              echo "UPLOAD_FILES<<EOF"
              printf "%s\n" "$files"
              echo "EOF"
            } >> "$GITHUB_ENV"
            echo "[Info] Files to upload:"
            printf "%s\n" "$files"
          fi

      - name: Create GitHub Release (tag push)
        if: github.event_name == 'push' && env.NO_ARTIFACTS != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          fail_on_unmatched_files: true
          files: ${{ env.UPLOAD_FILES }}

      - name: Create GitHub Release (workflow_dispatch, with notes file)
        if: github.event_name == 'workflow_dispatch' && env.NO_ARTIFACTS != '1' && env.RELEASE_NOTES_PATH != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.RELEASE_TARGET }}
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          fail_on_unmatched_files: true
          files: ${{ env.UPLOAD_FILES }}

      - name: Create GitHub Release (workflow_dispatch, with input notes)
        if: github.event_name == 'workflow_dispatch' && env.NO_ARTIFACTS != '1' && env.RELEASE_NOTES_PATH == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.RELEASE_TARGET }}
          body: ${{ inputs.notes }}
          fail_on_unmatched_files: true
          files: ${{ env.UPLOAD_FILES }}

      - name: Upload artifacts summary
        if: always()
        shell: bash
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Release Tag: $RELEASE_TAG" >> $GITHUB_STEP_SUMMARY
          echo "- Target Commit: $RELEASE_TARGET" >> $GITHUB_STEP_SUMMARY
          if [ "$NO_ARTIFACTS" = "1" ]; then
            echo "- ⚠️ No artifacts were produced" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ✅ Artifacts uploaded successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Built Files" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$UPLOAD_FILES" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
