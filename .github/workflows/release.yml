name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version (e.g., v1.0.0)"
        required: true
        type: string
      notes:
        description: "Release Notes / Changelog"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Build Frontend
        run: |
          cd web
          bun install --frozen-lockfile
          bun run build

      - name: Run Go Tests
        run: go test -v -race ./...

      - name: Run Go Vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.7.2
          args: --timeout=5m

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: linux
            goarch: arm
            goarm: "7"
            suffix: "-armv7"
          - goos: linux
            goarch: loong64
            suffix: "-loong64"
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
          - goos: windows
            goarch: amd64
            ext: .exe
            suffix: ""
          - goos: windows
            goarch: "386"
            ext: .exe
            suffix: "-386"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Build Frontend
        run: |
          cd web
          bun install --frozen-lockfile
          bun run build

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm || '' }}
          CGO_ENABLED: 0
        run: |
          output="msp-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w" -o "${output}" ./cmd/msp
          echo "artifact=${output}" >> "$GITHUB_ENV"
          ls -la "${output}"

      - name: Compute SHA256 Checksum
        run: |
          sha256sum "${{ env.artifact }}" > "${{ env.artifact }}.sha256"
          cat "${{ env.artifact }}.sha256"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: msp-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
          path: |
            ${{ env.artifact }}
            ${{ env.artifact }}.sha256
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ""
      RELEASE_NOTES_PATH: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set release tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="${{ inputs.version }}"
          fi
          if [ "${tag#v}" = "$tag" ]; then
            tag="v$tag"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "Release tag: $tag"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: |
          echo "## Downloaded Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find artifacts -type f | sort >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare release notes
        shell: bash
        env:
          NOTES_INPUT: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          notes_path="docs/release/$RELEASE_TAG.md"
          if [ -f "$notes_path" ]; then
            tmp_notes="$RUNNER_TEMP/release_notes_$RELEASE_TAG.md"
            cp "$notes_path" "$tmp_notes"
            echo "RELEASE_NOTES_PATH=$tmp_notes" >> "$GITHUB_ENV"
            echo "Using release notes from: $notes_path"
          else
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "Release notes file not found: $notes_path" >&2
              echo "Creating default release notes..."
              tmp_notes="$RUNNER_TEMP/release_notes_$RELEASE_TAG.md"
              echo "Release $RELEASE_TAG" > "$tmp_notes"
              echo "" >> "$tmp_notes"
              echo "See commit history for details." >> "$tmp_notes"
              echo "RELEASE_NOTES_PATH=$tmp_notes" >> "$GITHUB_ENV"
            elif [ -z "$NOTES_INPUT" ]; then
              echo "Release notes file not found and no input notes provided: $notes_path" >&2
              exit 1
            else
              echo "RELEASE_NOTES_PATH=" >> "$GITHUB_ENV"
            fi
          fi

      - name: Create GitHub Release (tag push)
        if: github.event_name == 'push' && env.RELEASE_NOTES_PATH != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          fail_on_unmatched_files: true
          files: artifacts/*

      - name: Create GitHub Release (workflow_dispatch, with notes file)
        if: github.event_name == 'workflow_dispatch' && env.RELEASE_NOTES_PATH != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          fail_on_unmatched_files: true
          files: artifacts/*

      - name: Create GitHub Release (workflow_dispatch, with input notes)
        if: github.event_name == 'workflow_dispatch' && env.RELEASE_NOTES_PATH == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          body: ${{ inputs.notes }}
          fail_on_unmatched_files: true
          files: artifacts/*

      - name: Release summary
        if: always()
        shell: bash
        run: |
          echo "## Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release Tag: $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
