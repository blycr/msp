version: 2
updates:
  # Maintain Go dependencies
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dependencies:
        patterns:
          - "*"

  # Maintain frontend dependencies. `web/` is managed by Bun (only bun.lock is
  # tracked — no package-lock.json / yarn.lock / pnpm-lock.yaml), so the
  # ecosystem must be "bun". The npm_and_yarn updater aborts with
  # misconfigured_tooling and cannot update bun.lock.
  - package-ecosystem: "bun"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dependencies:
        patterns:
          - "*"

  # Maintain GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10

  # Maintain Docker base images used by Dockerfile / docker-compose.yml
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
